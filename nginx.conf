server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect /2 without trailing slash to /2/
    location = /2 {
        return 301 /2/;
    }

    # Serve the app under /2/ prefix (matching homepage in package.json)
    location /2/ {
        alias /usr/share/nginx/html/;
        try_files $uri /index.html;
        
        # Cache static assets
        location ~ ^/2/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
